x-flink-common: &flink-common
  build: ./consumer
  image: cs-e4780-flink:1.20.5
  environment:
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: jobmanager
      jobmanager.memory.process.size: 1024m
      taskmanager.memory.process.size: 2048m
      taskmanager.numberOfTaskSlots: 4
      taskmanager.registration.timeout: 100000
      heartbeat.timeout: 100000
      metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
      metrics.reporter.prom.port: 9249

services:
  kafka1:
    image: confluentinc/cp-kafka:latest
    container_name: kafka1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka1:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:9093,2@kafka2:9093,3@kafka3:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "Mk3OEYBSD34fcwNTJENDM2Qk"
      KAFKA_LOG_CLEANUP_POLICY: delete  # Set log cleanup policy to delete
      KAFKA_LOG_RETENTION_MINUTES: 3
      KAFKA_TRANSACTION_REMOVE_EXPIRED_TRANSACTION_CLEANUP_INTERVAL_MS: 120000
    ports:
      - "9092:9092"
      - "9093:9093"

  kafka2:
    image: confluentinc/cp-kafka:latest
    container_name: kafka2
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka2:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 2
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:9093,2@kafka2:9093,3@kafka3:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "Mk3OEYBSD34fcwNTJENDM2Qk"
      KAFKA_LOG_CLEANUP_POLICY: delete  # Set log cleanup policy to delete
      KAFKA_LOG_RETENTION_MINUTES: 3
      KAFKA_TRANSACTION_REMOVE_EXPIRED_TRANSACTION_CLEANUP_INTERVAL_MS: 120000
    ports:
      - "9094:9092"
      - "9095:9093"

  kafka3:
    image: confluentinc/cp-kafka:latest
    container_name: kafka3
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka3:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 3
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:9093,2@kafka2:9093,3@kafka3:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "Mk3OEYBSD34fcwNTJENDM2Qk"
      KAFKA_LOG_CLEANUP_POLICY: delete  # Set log cleanup policy to delete
      KAFKA_LOG_RETENTION_MINUTES: 3
      KAFKA_TRANSACTION_REMOVE_EXPIRED_TRANSACTION_CLEANUP_INTERVAL_MS: 120000
    ports:
      - "9096:9092"
      - "9097:9093"

  kafka4:
    image: confluentinc/cp-kafka:latest
    container_name: kafka4
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka4:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      KAFKA_PROCESS_ROLES: broker
      KAFKA_NODE_ID: 4
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:9093,2@kafka2:9093,3@kafka3:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka4:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "Mk3OEYBSD34fcwNTJENDM2Qk"
      KAFKA_LOG_CLEANUP_POLICY: delete  # Set log cleanup policy to delete
      KAFKA_LOG_RETENTION_MINUTES: 3
      KAFKA_TRANSACTION_REMOVE_EXPIRED_TRANSACTION_CLEANUP_INTERVAL_MS: 120000
    ports:
      - "9098:9092"

  kafka5:
    image: confluentinc/cp-kafka:latest
    container_name: kafka5
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka5:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      KAFKA_PROCESS_ROLES: broker
      KAFKA_NODE_ID: 5
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:9093,2@kafka2:9093,3@kafka3:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka5:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "Mk3OEYBSD34fcwNTJENDM2Qk"
      KAFKA_LOG_CLEANUP_POLICY: delete  # Set log cleanup policy to delete
      KAFKA_LOG_RETENTION_MINUTES: 3
      KAFKA_TRANSACTION_REMOVE_EXPIRED_TRANSACTION_CLEANUP_INTERVAL_MS: 120000
    ports:
      - "9099:9092"
  
  kafka-init-topics:
    image: confluentinc/cp-kafka:latest
    command: [ "/bin/bash", "-c", "/create_topic.sh"]
    volumes:
      - type: bind
        source: ./producer/create_topic.sh
        target: /create_topic.sh
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
      kafka4:
        condition: service_healthy
      kafka5:
        condition: service_healthy
    init: true


  producer:
    build: ./producer
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
      kafka4:
        condition: service_healthy
      kafka5:
        condition: service_healthy
      job-submitter:
        condition: service_completed_successfully
    volumes:
      - ./producer/data:/app/data
    command: sh -c "sleep 10 && python main.py"
    environment:
      BATCH_SIZE: 10000

  timescaledb:
    build:
      context: ./database
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=stocksdb
    ports:
      - "5433:5432"
    volumes:
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  python-db-helper:
    build:
      context: ./python-db-helper
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=password
      - DB_NAME=stocksdb
    volumes:
      - ./python-db-helper:/app
    command: ["python", "populate_stocks.py"]

  fastapi:
     container_name: datamanagement-fastapi-1
     build:
       context: ./timescale-fastapi
     depends_on:
       timescaledb:
         condition: service_healthy
       redis:
         condition: service_started
     environment:
       - DB_HOST=timescaledb
       - DB_PORT=5432
       - DB_USER=postgres
       - DB_PASS=password
       - DB_NAME=stocksdb
     ports:
       - "8000:8000"
     volumes:
       - ./timescale-fastapi:/usr/app
     command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  jobmanager:
    <<: *flink-common
    hostname: "jobmanager"
    expose:
      - "6123"
    ports:
      - "8081:8081"
    command: jobmanager
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/overview"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Task managers write checkpoint state and the job manager writes the checkpoint metadata,
  # so both need the same checkpoint directory.
  taskmanager:
    <<: *flink-common
    depends_on:
      jobmanager:
        condition: service_healthy
    command: taskmanager
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    restart: on-failure
    scale: 1

  job-submitter:
    <<: *flink-common
    depends_on:
      kafka-init-topics:
        condition: service_completed_successfully
      python-db-helper:
        condition: service_completed_successfully
      jobmanager:
        condition: service_healthy
      taskmanager:
        condition: service_started
    volumes:
      - ./consumer/submit_job.sh:/opt/submit_job.sh
      - ./consumer/jdbc_compat.py:/opt/jdbc_compat.py
      - ./consumer/flink_job_ema.py:/opt/flink_job_ema.py
      - ./consumer/flink_job_price.py:/opt/flink_job_price.py
      - ./consumer/flink_job_topic_read.py:/opt/flink_job_topic_read.py
      - ./consumer/flink_job_same_window.py:/opt/flink_job_same_window.py
    entrypoint: ["/bin/bash", "/opt/submit_job.sh"]

  redis:
    image: redis:alpine
    ports:
      - 6379:6379
  
  grafana:
    image: grafana/grafana:10.0.2
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/provisioning:/etc/grafana/provisioning
    environment:
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
      - GF_DATE_FORMATS_FULL_DATE=YYYY-MM-DD HH:mm:ss.SSS
      
      # Default admin credentials (for admin access if needed)
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin

  # Centralized logging: Vector -> Elasticsearch -> Kibana (http://localhost:5601).
  # Nothing in the data pipeline depends on these services.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # Only the templates from logging/setup.sh may shape the log data streams.
      - stack.templates.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  logging-setup-es:
    image: curlimages/curl:8.10.1
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./logging/setup.sh:/setup.sh:ro
    entrypoint: ["sh", "/setup.sh", "elasticsearch"]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"

  logging-setup-kibana:
    image: curlimages/curl:8.10.1
    depends_on:
      kibana:
        condition: service_started
    volumes:
      - ./logging/setup.sh:/setup.sh:ro
    entrypoint: ["sh", "/setup.sh", "kibana"]

  # Starts first so it also captures one-shot containers (kafka-init-topics, python-db-helper,
  # job-submitter); logs are buffered on disk until Elasticsearch is ready.
  vector:
    image: timberio/vector:0.41.1-debian
    command: ["--config", "/etc/vector/vector.yaml"]
    volumes:
      - ./logging/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector-data:/var/lib/vector

  # Monitoring: exporters -> Prometheus (http://localhost:9090) -> Alertmanager (http://localhost:19093)
  # -> email. SMTP settings come from .env (see .env.example); otherwise mail lands in Mailpit.
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.external-url=http://localhost:9090
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    entrypoint: ["sh", "/alertmanager.sh"]
    command: ["--web.external-url=http://localhost:19093"]
    environment:
      SMTP_SMARTHOST: ${SMTP_SMARTHOST:-mailpit:1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-alertmanager@financial-analysis.local}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-team@financial-analysis.local}
    ports:
      - "19093:9093"
    volumes:
      - ./monitoring/alertmanager.sh:/alertmanager.sh:ro
      - alertmanager-data:/alertmanager

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "8025:8025"

  docker-exporter:
    build: ./monitoring/docker-exporter
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Mounting / gives the Docker Desktop VM's root filesystem, where the Docker disk is mounted.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    command:
      - --kafka.server=kafka1:9092
      - --kafka.server=kafka2:9092
      - --kafka.server=kafka3:9092
      - --kafka.server=kafka4:9092
      - --kafka.server=kafka5:9092
    # Exits when no broker is reachable at startup.
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:password@timescaledb:5432/stocksdb?sslmode=disable

volumes:
  flink-checkpoints:
  es-data:
  vector-data:
  prometheus-data:
  alertmanager-data: