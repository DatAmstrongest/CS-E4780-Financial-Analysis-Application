global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]

  # State, CPU and memory of every container of the compose project.
  - job_name: docker
    static_configs:
      - targets: [docker-exporter:9417]

  # CPU, memory and disk of the Docker host (the Docker Desktop VM on macOS).
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]

  - job_name: timescaledb
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: flink
    static_configs:
      - targets: [jobmanager:9249]
        labels:
          service: jobmanager
      - targets: [taskmanager:9249]
        labels:
          service: taskmanager
